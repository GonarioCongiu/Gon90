[workspace]
resolver = "2"
members = ["crates/folio-core", "crates/folio"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["Folio contributors"]

[workspace.dependencies]
folio-core = { path = "crates/folio-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
async-channel = "2"
dirs = "6"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
