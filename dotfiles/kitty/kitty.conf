# FOLIO — kitty: carta e inchiostro anche nel terminale.
font_family      JetBrains Mono
font_size        12.0
window_padding_width 18
hide_window_decorations yes
confirm_os_window_close 0
cursor_shape beam
touch_scroll_multiplier 3.0
enable_audio_bell no

background #F3F0E8
foreground #141413
selection_background #141413
selection_foreground #F3F0E8
cursor #D4442A
url_color #D4442A

# Nero, rosso, verde, giallo, blu, magenta, ciano, bianco (normali e chiari)
