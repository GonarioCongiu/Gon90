# ════════════════════════════════════════════════════════════════════
#  FOLIO — schermata di blocco (hyprlock usa ancora la sintassi hyprlang)
#  Impaginata come una copertina: testata, data enorme, campo a filetto.
#  Tocca "Tastiera" per la tastiera a schermo (wvkbd è abilitato sopra
#  il blocco da una layer rule in folio/rules.lua).
# ════════════════════════════════════════════════════════════════════

$paper  = rgb(243, 240, 232)
$ink    = rgb(20, 20, 19)
$ink2   = rgba(20, 20, 19, 0.55)
$rule   = rgba(20, 20, 19, 0.18)
$accent = rgb(212, 68, 42)
$serif  = Instrument Serif
$sans   = Inter
$mono   = JetBrains Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2500
}

animations {
    enabled = true
    bezier = folio, 0.22, 1.0, 0.36, 1.0
    animation = fadeIn, 1, 4, folio
    animation = fadeOut, 1, 3, folio
    animation = inputFieldDots, 1, 2, folio
}

background {
    monitor =
    color = $paper
}

# ── Testata ──
label {
    monitor =
    text = FOLIO
    color = $ink
    font_size = 96
    font_family = $serif
    position = 64, -40
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] folio date issue --upper
    color = $ink2
    font_size = 11
    font_family = $mono
    position = -64, -150
    halign = right
    valign = top
}

shape {
    monitor =
    size = 92%, 1
    color = $rule
    position = 0, -178
    halign = center
    valign = top
}

# ── La data in corpo enorme ──
label {
    monitor =
    text = $TIME
    color = $ink
    font_size = 220
    font_family = $serif
    position = 56, 150
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] echo "<i>$(folio date long)</i>"
    color = $ink
    font_size = 40
    font_family = $serif
    position = 64, 96
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] folio date edition --upper
    color = $accent
    font_size = 11
    font_family = $mono
    position = 66, 64
    halign = left
    valign = bottom
}

# ── Accesso: un filetto, nessuna scatola ──
input-field {
    monitor =
    size = 420, 64
    outline_thickness = 1
    rounding = 32
    dots_size = 0.18
    dots_spacing = 0.45
    dots_center = true
    outer_color = $ink
    inner_color = $paper
    font_color = $ink
    font_family = $sans
    check_color = $accent
    fail_color = $accent
    fade_on_empty = false
    placeholder_text = <i>Parola d'ordine</i>
    fail_text = <i>$FAIL</i>
    position = -64, 120
    halign = right
    valign = bottom
}

label {
    monitor =
    text = $DESC
    color = $ink2
    font_size = 12
    font_family = $mono
    position = -72, 200
    halign = right
    valign = bottom
}

# Tocca per la tastiera a schermo.
label {
    monitor =
    text = TASTIERA  ⌨
    color = $ink
    font_size = 12
    font_family = $mono
    position = -64, 56
    halign = right
    valign = bottom
    onclick = pkill -RTMIN -x wvkbd-mobintl || (wvkbd-mobintl -L 280 &)
}
