# FOLIO — inattività (hypridle, sintassi hyprlang)
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' || hyprctl dispatch dpms on
    # Sul blocco la tastiera a schermo deve essere pronta; poi torna nascosta.
    on_lock_cmd = pkill -USR2 -x wvkbd-mobintl
    on_unlock_cmd = pkill -USR1 -x wvkbd-mobintl
}

# 2 min 30 s: abbassa la luminosità (ripristinata al tocco).
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 5 min: blocca.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: spegne lo schermo.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' || hyprctl dispatch dpms on
}

# 20 min: sospende.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
